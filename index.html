<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Chitrarekha Sehat Setu: health information kiosk prototype for village Tighra (UEDP-5).">
<title>चित्ररेखा सेहत सेतु</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&family=Hind:wght@400;500;600&display=swap">
<style>
/* Layout: kiosk = fixed header + one scrolling "story" per topic (photo hook first, then 2–3 short sections) + fixed bottom topic bar.
   Single deliberate light theme: a public kiosk in a health centre, matched to the existing Sehat Setu identity. */
:root {
  color-scheme: light;
  --forest: #0E4A3A;      /* primary: trust, government health */
  --forest-2: #15634E;
  --brick: #8A3A22;       /* emergency / warning */
  --sun: #F5C84B;         /* highlight, audio */
  --cream: #F6F3EA;       /* page ground */
  --paper: #FFFFFF;
  --ink: #1B2420;
  --ink-2: #4B5A53;
  --line: #DCD6C6;
  --ok: #1F7A4D;  --ok-bg: #E2F3E8;
  --no: #B3261E;  --no-bg: #FBE4E1;
  --display: "Mukta", "Noto Sans Devanagari", system-ui, sans-serif;
  --body: "Hind", "Noto Sans Devanagari", system-ui, sans-serif;
  --r: 22px;
  --tap: 64px;            /* minimum touch target on the kiosk */
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--body); font-size: 20px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; max-width: 1400px; margin: 0 auto; background: var(--cream); position: relative; overflow: hidden; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 14px; padding-block: 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); background: var(--paper); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
.mark { width: 48px; height: 48px; border-radius: 14px; background: var(--forest); display: grid; place-items: center; flex: none; }
.brand b { font-family: var(--display); font-size: 24px; font-weight: 800; color: var(--forest); display: block; line-height: 1.1; }
.brand small { font-size: 14px; color: var(--ink-2); }
.top .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 18px; border-radius: 999px; border: 0; font-weight: 600; font-size: 18px; }
.chip.audio { background: var(--sun); color: var(--ink); }
.chip.audio.on { animation: pulse 1.2s ease-in-out infinite; }
.chip.lang { background: var(--cream); border: 1px solid var(--line); color: var(--ink-2); }
.chip.lang .on { color: var(--forest); font-weight: 800; }
.chip.sos { background: var(--brick); color: #fff; font-family: var(--display); font-size: 21px; font-weight: 800; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(245, 200, 75, .35); } }

/* ---------- screens ---------- */
.stage { position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
.screen[hidden] { display: none !important; }
.screen.enter { animation: enter .42s cubic-bezier(.2, .7, .2, 1); }
@keyframes enter { from { opacity: .0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.wrap { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 22px 40px; display: grid; gap: 26px; }

/* home */
.welcome { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; background: var(--forest); color: #fff; border-radius: var(--r); padding: 26px 30px; }
.welcome h1 { font-size: clamp(30px, 3.4vw, 44px); font-weight: 800; }
.welcome p { margin: 6px 0 0; color: #CFE3DA; font-size: 19px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.tile { position: relative; border: 0; padding: 0; border-radius: var(--r); overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; text-align: left; background: var(--forest); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.06); transition: transform .18s ease; }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
.tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7, 30, 23, 0) 30%, rgba(7, 30, 23, .88) 100%); }
.tile:hover img { transform: scale(1.04); }
.tile:active { transform: scale(.97); }
.tile .num { position: absolute; z-index: 1; top: 14px; left: 14px; width: 46px; height: 46px; border-radius: 12px; background: rgba(255,255,255,.94); color: var(--forest); font-family: var(--display); font-weight: 800; font-size: 22px; display: grid; place-items: center; }
.tile .badge { position: absolute; z-index: 1; top: 16px; right: 14px; background: var(--sun); color: var(--ink); font-weight: 600; font-size: 16px; padding: 6px 12px; border-radius: 999px; }
.tile .cap { position: absolute; z-index: 1; left: 18px; right: 18px; bottom: 16px; }
.tile h2 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 800; }
.tile .cap span { font-size: 17px; color: #E4EFE9; }
.sosbar { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 14px; align-items: center; background: var(--paper); border-radius: var(--r); padding: 16px; border: 1px solid var(--line); }
.sosbar > b { font-family: var(--display); font-size: 22px; padding: 0 8px; }
.callbtn { min-height: var(--tap); border-radius: 16px; border: 0; font-family: var(--display); font-weight: 800; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; }
.callbtn small { font-family: var(--body); font-weight: 500; font-size: 16px; opacity: .9; }
.c108 { background: var(--brick); } .c104 { background: var(--forest); } .c181 { background: var(--sun); color: var(--ink); }

/* topic story */
.hero { position: relative; min-height: 470px; border-radius: 0 0 var(--r) var(--r); overflow: hidden; display: flex; align-items: flex-end; color: #fff; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: kb 14s ease-out both; }
@keyframes kb { from { transform: scale(1.08); } to { transform: scale(1); } }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6, 28, 21, .92) 0%, rgba(6, 28, 21, .55) 48%, rgba(6, 28, 21, .05) 80%); }
.hero .in { position: relative; z-index: 1; padding: 34px 36px 30px; max-width: 760px; display: grid; gap: 16px; }
.eyebrow { display: inline-flex; width: max-content; max-width: 100%; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); padding: 5px 12px; border-radius: 999px; }
.hero h1 { font-size: clamp(36px, 4.6vw, 60px); font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--sun); }
.bigstat { display: flex; gap: 14px; flex-wrap: wrap; }
.bigstat div { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 16px; padding: 10px 16px; }
.bigstat b { font-family: var(--display); font-size: 34px; font-weight: 800; color: var(--sun); display: block; line-height: 1; font-variant-numeric: tabular-nums; }
.bigstat span { font-size: 16px; color: #E0ECE6; }
.scrollcue { display: inline-flex; align-items: center; gap: 10px; width: max-content; background: var(--paper); color: var(--forest); border: 0; border-radius: 999px; padding: 10px 20px; min-height: 52px; font-weight: 600; font-size: 18px; }
.scrollcue svg { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(5px); } }

.sec { display: grid; gap: 16px; }
.sec > h2 { font-size: 30px; font-weight: 800; color: var(--forest); display: flex; align-items: center; gap: 12px; }
.sec > h2 .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--forest); display: grid; place-items: center; flex: none; }
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.card { background: var(--paper); border-radius: var(--r); padding: 22px; border: 1px solid var(--line); display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h3 { font-size: 25px; font-weight: 800; }
.card .km { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; color: var(--forest); font-variant-numeric: tabular-nums; }
.card .km small { font-size: 22px; }
.meta { color: var(--ink-2); font-size: 18px; }
.pill { display: inline-block; width: max-content; font-size: 15px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--cream); border: 1px solid var(--line); }
.pill.red { background: var(--no-bg); color: var(--brick); border-color: #F1C4BC; }
.pill.green { background: var(--ok-bg); color: var(--ok); border-color: #BFE3CB; }
.ticks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 19px; }
.ticks li { display: flex; gap: 10px; align-items: baseline; }
.ticks li::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--sun); transform: translateY(-2px); }
.cta { min-height: var(--tap); border: 0; border-radius: 16px; background: var(--forest); color: #fff; font-weight: 600; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px; }
.cta.red { background: var(--brick); }
.cta.ghost { background: var(--cream); color: var(--forest); border: 1px solid var(--line); }

/* route line */
.route { background: var(--paper); border-radius: var(--r); border: 1px solid var(--line); padding: 26px 30px; }
.route .line { position: relative; height: 10px; background: var(--line); border-radius: 10px; margin: 34px 8px 16px; }
.route .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--forest); border-radius: 10px; transition: width 1.4s cubic-bezier(.2,.7,.2,1); }
.route .stop { position: absolute; top: 50%; width: 26px; height: 26px; border-radius: 50%; background: var(--paper); border: 6px solid var(--forest); transform: translate(-50%, -50%); }
.route .stop.last { border-color: var(--brick); }
.route .labels { position: relative; height: 62px; font-size: 18px; }
.route .labels span { position: absolute; top: 0; white-space: nowrap; }
.route .labels b { font-family: var(--display); font-size: 22px; display: block; }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.step { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 8px; align-content: start; }
.step .n { width: 52px; height: 52px; border-radius: 50%; background: var(--sun); font-family: var(--display); font-weight: 800; font-size: 26px; display: grid; place-items: center; }
.step h3 { font-size: 24px; font-weight: 800; }
.step p { margin: 0; color: var(--ink-2); font-size: 19px; }

/* do / don't */
.dd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.ddcard { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; }
.ddcard header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; }
.ddcard header .em { width: 48px; height: 48px; border-radius: 14px; background: var(--cream); display: grid; place-items: center; flex: none; }
.ddcard h3 { font-size: 25px; font-weight: 800; }
.ddrow { display: grid; grid-template-columns: 1fr 1fr; }
.ddrow > div { padding: 14px 20px 18px; font-size: 19px; line-height: 1.4; display: grid; gap: 4px; align-content: start; }
.ddrow .do { background: var(--ok-bg); } .ddrow .dont { background: var(--no-bg); }
.ddrow b { font-family: var(--display); font-size: 18px; }
.ddrow .do b { color: var(--ok); } .ddrow .dont b { color: var(--no); }

/* recipe */
.recipe { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 14px; align-items: center; background: var(--forest); color: #fff; border-radius: var(--r); padding: 22px; }
.recipe .ing { background: rgba(255,255,255,.1); border-radius: 16px; padding: 14px; text-align: center; }
.recipe .ing b { font-family: var(--display); font-size: 34px; color: var(--sun); display: block; line-height: 1.1; }
.recipe .ing span { font-size: 17px; }

/* habits */
.habits { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.habit { min-height: 120px; border-radius: 18px; border: 2px dashed var(--line); background: var(--paper); padding: 14px; text-align: left; display: grid; gap: 8px; align-content: space-between; font-size: 18px; font-weight: 500; transition: background .2s, border-color .2s, transform .15s; }
.habit .box { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; transition: all .2s; }
.habit[aria-pressed="true"] { border: 2px solid var(--ok); background: var(--ok-bg); }
.habit[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); }
.habit[aria-pressed="true"] .box::after { content: ""; width: 9px; height: 16px; border: solid #fff; border-width: 0 4px 4px 0; transform: rotate(45deg) translate(-1px, -2px); animation: pop .25s ease; }
.habit:active { transform: scale(.97); }
@keyframes pop { from { transform: rotate(45deg) scale(0); } }
.score { display: flex; align-items: center; gap: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; }
.meter { flex: 1; height: 14px; border-radius: 10px; background: var(--cream); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 10px; transition: width .4s ease; }
.score b { font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }

/* medicine grid */
.meds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.med { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.med .ico { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; background: var(--ok-bg); }
.med h3 { font-size: 22px; font-weight: 800; }
.med p { margin: 0; color: var(--ink-2); font-size: 17px; line-height: 1.35; }

/* myth flip cards */
.myths { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.flip { border: 0; padding: 0; background: none; perspective: 1400px; min-height: 270px; text-align: left; }
.flip .inner { position: relative; width: 100%; height: 100%; min-height: 270px; transition: transform .6s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; }
.flip[aria-pressed="true"] .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--r); padding: 24px; display: grid; gap: 10px; align-content: space-between; }
.face.myth { background: var(--no-bg); border: 2px solid #F1C4BC; }
.face.fact { background: var(--ok-bg); border: 2px solid #BFE3CB; transform: rotateY(180deg); }
.face .tag { font-family: var(--display); font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.face.myth .tag { color: var(--no); } .face.fact .tag { color: var(--ok); }
.face q { font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.25; quotes: "“" "”"; }
.face p { margin: 0; font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.3; }
.face .hint { font-size: 17px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }

/* contact band */
.band { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; background: var(--forest); color: #fff; border-radius: var(--r); padding: 22px 26px; }
.band h3 { font-size: 25px; } .band p { margin: 4px 0 0; color: #CFE3DA; font-size: 18px; }
.band .callbtn { padding: 0 22px; }
.band .c104 { background: var(--sun); color: var(--ink); }

/* bottom nav */
.nav { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; background: var(--paper); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.nav button { min-height: 68px; border-radius: 16px; border: 1px solid var(--line); background: var(--cream); display: grid; place-items: center; gap: 2px; padding: 6px; font-size: 16px; font-weight: 600; line-height: 1.2; text-align: center; transition: background .2s, color .2s; }
.nav button[aria-current="page"] { background: var(--forest); color: #fff; border-color: var(--forest); }

/* call sheet */
.sheet { position: absolute; inset: 0; background: rgba(10, 22, 18, .55); display: grid; place-items: center; z-index: 20; animation: fade .2s ease; padding: 20px; }
.sheet[hidden] { display: none !important; }
@keyframes fade { from { opacity: 0; } }
.sheet .box { background: var(--paper); border-radius: 26px; padding: 30px; width: min(520px, 100%); text-align: center; display: grid; gap: 14px; animation: rise .3s cubic-bezier(.2,.7,.2,1); }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.sheet .num { font-family: var(--display); font-weight: 800; font-size: 96px; line-height: 1; color: var(--brick); letter-spacing: .02em; }
.sheet p { margin: 0; font-size: 20px; color: var(--ink-2); }

.toast { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 18px; z-index: 30; animation: rise .25s ease; max-width: calc(100% - 40px); text-align: center; }
.toast[hidden] { display: none !important; }

/* heat-map (testing tool) */
#heat { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
.testbar { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 86px; z-index: 41; display: flex; gap: 8px; background: var(--ink); color: #fff; border-radius: 14px; padding: 8px; font-size: 14px; align-items: center; }
.testbar[hidden] { display: none !important; }
.testbar button { background: #34413B; border: 0; color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 14px; }

@media (max-width: 900px) {
  .tiles, .meds { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps, .dd, .myths { grid-template-columns: 1fr; }
  .habits { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .recipe { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .recipe .cta { grid-column: 1 / -1; }
  .band { grid-template-columns: 1fr; }
  .nav { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sosbar { grid-template-columns: 1fr; }
  .welcome { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .tiles, .meds { grid-template-columns: 1fr; }
  .brand small { display: none; }
  .top { gap: 8px; }
  .chip { padding: 0 12px; font-size: 16px; }
  .ddrow { grid-template-columns: 1fr; }
  .hero { min-height: 520px; }
}
/* documentation export (full-length capture) */
.doc .app { height: auto; overflow: visible; }
.doc .stage, .doc .screen { position: static; overflow: visible; }
.doc .screen.enter, .doc .hero img { animation: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>


</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="brand" data-go="home" id="brand">
      <span class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F5C84B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/><path d="M12 9v5M9.5 11.5h5"/></svg></span>
      <span><b id="brandName">चित्ररेखा सेहत सेतु</b><small id="brandSub">ग्राम तिघरा, बरघाट · कियोस्क TGH-01</small></span>
    </button>
    <span class="sp"></span>
    <button class="chip audio" id="audio" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span id="audioLbl">सुनें</span></button>
    <button class="chip lang" id="lang" aria-label="भाषा बदलें / Change language"><span data-l="hi" class="on">हिंदी</span>·<span data-l="en">English</span></button>
    <button class="chip sos" data-call="108" id="sosTop">108 आपातकाल</button>
  </header>

  <main class="stage" id="stage"></main>

  <nav class="nav" id="nav"></nav>

  <div class="sheet" id="sheet" hidden>
    <div class="box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <p id="sheetTitle">अपने फ़ोन से यह नंबर मिलाएँ</p>
      <div class="num" id="sheetNum">108</div>
      <p id="sheetSub">कॉल मुफ़्त है · 24 घंटे</p>
      <button class="cta" id="sheetClose">ठीक है</button>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <canvas id="heat"></canvas>

function go(id) {
  if (!screens[id]) return;
  stopSpeech();
  if (id !== current || screens[id].hidden) {
    Object.values(screens).forEach(s => { s.hidden = true; });
    const s = screens[id]; s.hidden = false; s.scrollTop = 0;
    s.classList.remove('enter'); void s.offsetWidth; s.classList.add('enter');
    current = id;
  }
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.go === id ? 'page' : 'false'));
  if (id !== 'home') animateTopic(screens[id]);
  try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) {}
}
function animateTopic(s) {
  s.querySelectorAll('.fill').forEach(f => { f.style.width = '0'; requestAnimationFrame(() => requestAnimationFrame(() => f.style.width = f.dataset.fill + '%')); });
  s.querySelectorAll('[data-count]').forEach(el => {
    const txt = el.textContent, m = txt.match(/^([^\d]*)(\d[\d,]*)(.*)$/);
    if (!m || !/\+/.test(txt) || document.documentElement.classList.contains('doc') || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const target = parseInt(m[2].replace(/,/g, ''), 10); if (target < 2) return;
    const t0 = performance.now();
    const tick = now => { const k = Math.min(1, (now - t0) / 700); el.textContent = m[1] + Math.round(target * (1 - Math.pow(1 - k, 3))) + m[3]; if (k < 1) requestAnimationFrame(tick); else el.textContent = txt; };
    requestAnimationFrame(tick);
  });
}
function setLang(l) {

}

/* ---------------- audio: device text-to-speech, Hindi (hi-IN) or English (en-IN) ---------------- */
let VOICES = [];
function loadVoices() { try { VOICES = speechSynthesis.getVoices() || []; } catch (e) { VOICES = []; } }
loadVoices();
try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) {}
function pickVoice() {
  if (!VOICES.length) loadVoices();
  const by = p => VOICES.find(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(p));
  return LANG === 'en' ? (by('en-in') || by('en-gb') || by('en')) : (by('hi-in') || by('hi'));
}
let speaking = null;
function stopSpeech() {
  try { speechSynthesis.cancel(); } catch (e) {}
  document.querySelectorAll('.chip.audio').forEach(b => b.classList.remove('on'));
  const lbl = document.getElementById('audioLbl'); if (lbl) lbl.textContent = L('सुनें', 'Listen');
  speaking = null;
}
function speak(text, btn) {
  if (speaking) { stopSpeech(); return; }
  if (!('speechSynthesis' in window)) { toast(L('इस डिवाइस पर आवाज़ उपलब्ध नहीं', 'Voice is not available on this device')); return; }
  btn.classList.add('on'); if (btn.id === 'audio') document.getElementById('audioLbl').textContent = L('रोकें', 'Stop');
  speaking = btn;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANG === 'en' ? 'en-IN' : 'hi-IN'; u.rate = LANG === 'en' ? .95 : .9;
  const v = pickVoice(); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (speaking === btn) stopSpeech(); };
  u.onerror = () => { if (speaking === btn) stopSpeech(); };
  speechSynthesis.speak(u);
  if (speechSynthesis.paused) speechSynthesis.resume();
  setTimeout(() => {
    if (speaking === btn && !started && !speechSynthesis.speaking) {
      stopSpeech();
      toast(L('इस डिवाइस पर हिंदी आवाज़ नहीं मिली', 'No voice found on this device'));
    }
  }, 3000);
}

/* ---------------- testing tool: tap log + heat map (#test) ---------------- */
const heat = document.getElementById('heat'), app = document.getElementById('app');
let taps = [];
function loadTaps() { try { taps = JSON.parse(localStorage.getItem('sehat_taps') || '[]'); } catch (e) { taps = []; } }
function saveTaps() { try { localStorage.setItem('sehat_taps', JSON.stringify(taps)); } catch (e) {} }
function enableTest() {
  loadTaps(); document.getElementById('testbar').hidden = false; document.getElementById('tapCount').textContent = taps.length;
  app.addEventListener('pointerdown', e => {
    if (e.target.closest('#testbar')) return;
    const r = app.getBoundingClientRect(), s = screens[current];
    taps.push({ s: current, x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top + (s ? s.scrollTop : 0)) / r.height, t: Date.now() });
    saveTaps(); document.getElementById('tapCount').textContent = taps.length;
  }, true);
}
let heatOn = false;
function drawHeat() {
  const r = app.getBoundingClientRect(); heat.width = r.width; heat.height = r.height;
  const ctx = heat.getContext('2d'); ctx.clearRect(0, 0, r.width, r.height); if (!heatOn) return;
  const s = screens[current], off = s ? s.scrollTop : 0;
  const pts = taps.filter(p => p.s === current);
  const a = document.createElement('canvas'); a.width = r.width; a.height = r.height; const ac = a.getContext('2d');
  for (const p of pts) { const x = p.x * r.width, y = p.y * r.height - off; const g = ac.createRadialGradient(x, y, 0, x, y, 46); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ac.fillStyle = g; ac.fillRect(x - 46, y - 46, 92, 92); }
  const img = ac.getImageData(0, 0, r.width, r.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = d[i + 3] / 255; if (!v) continue; const h = Math.min(1, v * 1.6); d[i] = 255 * Math.min(1, h * 2); d[i + 1] = 255 * Math.min(1, 2 - h * 2) * (h > .5 ? 1 : h * 2); d[i + 2] = 255 * Math.max(0, 1 - h * 3); d[i + 3] = 150 * Math.min(1, v * 2); }
  ctx.putImageData(img, 0, 0);
}
document.getElementById('heatShow').addEventListener('click', () => { heatOn = !heatOn; document.getElementById('heatShow').textContent = heatOn ? 'Hide heat map' : 'Show heat map'; drawHeat(); });
document.getElementById('heatClear').addEventListener('click', () => { taps = []; saveTaps(); document.getElementById('tapCount').textContent = 0; drawHeat(); });
stage.addEventListener('scroll', () => heatOn && drawHeat(), true);

/* deep links: #hospital … #myth open a topic; #en / #hi pick the language; #test enables the tap recorder */
const h0 = location.hash.slice(1);
const mode = h0.match(/^doc-?([a-z]*)-?([a-z]*)$/);
if (mode) {
  document.documentElement.classList.add('doc');
  const st = mode[2];
  if (st === 'en') { LANG = 'en'; TOPICS = topics(); current = null; build(); }
  else if (LANG !== 'hi') { LANG = 'hi'; TOPICS = topics(); current = null; build(); }
  go(screens[mode[1]] ? mode[1] : 'home');
  if (st === 'flip') document.querySelectorAll('.flip')[0].click(), document.querySelectorAll('.flip')[2].click();
  if (st === 'habits') [0, 1, 2].forEach(i => screens[current].querySelector(`[data-habit="${i}"]`).click());
  if (st === 'call') { document.documentElement.classList.remove('doc'); screens[current].querySelector('[data-call="108"]').click(); }
} else {
  if (h0 === 'en' || h0 === 'hi') { if (h0 !== LANG) { LANG = h0; TOPICS = topics(); build(); } go('home'); }
  else if (h0 === 'test') { go('home'); enableTest(); }
  else go(screens[h0] ? h0 : 'home');
}
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (k === 'en' || k === 'hi') setLang(k); else if (screens[k]) go(k); });
</script>
